version: "3.9"

services:
  db:
    image: postgres:16
    container_name: vente_facile_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vente-facile-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vente_facile_backend
    env_file:
      - .env
    environment:
      - DB_HOST=db
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_started
    networks:
      - vente-facile-network
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
             
networks:
  vente-facile-network:
    driver: bridge

volumes:
  postgres_data:
