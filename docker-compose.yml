version: "3.9"

services:
  db:
    image: postgres:16
    container_name: vente_facile_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vente-facile-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vente_facile_backend
    env_file:
      - .env
    environment:
      - DB_HOST=db
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vente-facile-network
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn app.wsgi:application --bind 0.0.0.0:8000 --workers 3"
             
networks:
  vente-facile-network:
    driver: bridge

volumes:
  postgres_data:
