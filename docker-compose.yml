services:
  db:
    image: postgres:16
    container_name: vente_facile_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # Jamais sur 0.0.0.0 : Postgres etait joignable depuis Internet sur le port
    # 5436, seul le mot de passe protegeait les donnees. Les services applicatifs
    # passent par le reseau Docker et n'ont pas besoin de cette publication.
    # Acces distant pour administration : tunnel SSH
    # `ssh -L 5436:127.0.0.1:5436 user@vps` puis connexion sur 127.0.0.1:5436.
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vente-facile-network
    # VPS 8 Go partagé : borne la RAM de Postgres pour protéger les autres
    # services d'un OOM en cas de grosse requête.
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vente_facile_redis
    # Borne la mémoire Redis. Politique volatile-lru : n'évince QUE les clés avec
    # TTL (nos caches abonnement/quotas/dashboard) - les messages du broker Celery
    # (sans TTL) sont préservés, donc aucune tâche n'est perdue sous pression.
    command: redis-server --maxmemory 400mb --maxmemory-policy volatile-lru
    mem_limit: 512m
    volumes:
      - redis_data:/data
    networks:
      - vente-facile-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vente_facile_backend
    # ┌────────────────────────────────────────────────────────────────────┐
    # │ LA ROTATION DU JOURNAL VIT ICI, ET NULLE PART AILLEURS.            │
    # │                                                                    │
    # │ Django écrivait EN PLUS dans `logs/django.log`, avec son propre    │
    # │ `RotatingFileHandler`. Gunicorn tourne à deux workers : les deux   │
    # │ processus tenaient le même fichier, et la bascule de l'un laissait │
    # │ l'autre écrire dans un inode renommé puis supprimé - lignes        │
    # │ perdues, et disque occupé jusqu'au recyclage du worker. Le démon   │
    # │ est le SEUL écrivain, donc le seul qui puisse faire tourner un     │
    # │ fichier sans course. Même borne haute qu'avant : cinquante Mo.     │
    # └────────────────────────────────────────────────────────────────────┘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Ecoute liee a la loopback de l'hote : Traefik joint le conteneur par le
    # reseau Docker, la publication sur 0.0.0.0 exposait l'API en HTTP clair
    # depuis Internet (contournement de TLS). Le port reste joignable en local
    # pour le debogage : `curl http://127.0.0.1:8001/healthz/` sur le VPS.
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/1
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1500m
    # Liveness gunicorn (endpoint /healthz/, ne touche pas la DB). start_period
    # généreux : migrate + collectstatic tournent avant le démarrage de gunicorn.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz/', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - vente-facile-network

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vente_facile_celery_worker
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # 2 vCPU partagés avec gunicorn : concurrency 2 (prefetch=1 et
    # max-tasks-per-child sont fixés dans settings.py). Les tâches sont peu
    # fréquentes (poll Moko 60s, notifications) donc 2 suffit largement.
    command: celery -A app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/1
    volumes:
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m
    # ┌────────────────────────────────────────────────────────────────────┐
    # │ CE BATTEMENT CHARGE DJANGO EN ENTIER.                              │
    # │                                                                    │
    # │ `celery inspect ping` démarre un interpréteur, importe tout le      │
    # │ projet et interroge le worker par le courtier. À soixante secondes, │
    # │ sur un VPS 2 vCPU partagé avec gunicorn, cela consomme en continu   │
    # │ pour ne rien produire - même famille que le healthcheck qui         │
    # │ régénérait tout le schéma OpenAPI toutes les cinq secondes.         │
    # │                                                                    │
    # │ On garde `ping` parce qu'il prouve que le worker CONSOMME (un       │
    # │ simple contrôle de processus laisserait passer un worker figé), et  │
    # │ on espace à cinq minutes : un worker mort est rattrapé en un quart  │
    # │ d'heure, ce qui est le bon ordre de grandeur pour des tâches dont   │
    # │ la plus fréquente tourne à la minute.                               │
    # └────────────────────────────────────────────────────────────────────┘
    healthcheck:
      test: ["CMD-SHELL", "celery -A app inspect ping -t 10 || exit 1"]
      interval: 300s
      timeout: 20s
      retries: 3
      start_period: 60s
    networks:
      - vente-facile-network

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vente_facile_celery_beat
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    command: celery -A app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/1
    volumes:
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped
    mem_limit: 256m
    networks:
      - vente-facile-network

networks:
  vente-facile-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
